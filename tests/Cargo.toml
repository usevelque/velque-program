[package]
name = "velque-tests"
version = "0.1.0"
edition = "2021"

# Checks for the Velque program: pure clearing on the host and an end-to-end run
# of the built .so in LiteSVM. A separate crate so the program does not pull in std.

[dependencies]
velque = { path = "..", features = ["no-entrypoint"] }
litesvm = "0.15.2"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-pubkey = "4.2"
solana-instruction = "3.4"
solana-transaction = "4.1"
solana-message = "4.4"
solana-clock = "3.1"
solana-account = "4.3"
